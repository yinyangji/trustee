[package]
name = "sgx-aap-wrap"
version.workspace = true
authors.workspace = true
description = "Hold an Aliyun AAP client key in an SGX protected file and return only the requested KMS secret"
edition.workspace = true

[dependencies]
actix-web.workspace = true
aes-gcm = { version = "0.11.0", features = ["zeroize"] }
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
clap = { workspace = true, features = ["derive"] }
p256 = { workspace = true, features = ["ecdh"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
reqwest = { workspace = true, features = ["json", "default-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
zeroize.workspace = true
libc = "0.2"

[features]
# Link the guest-components Aliyun client into the wrap process.
# The client key is still only available after unseal.
aliyun = ["kms/aliyun"]

[dependencies.kms]
workspace = true
optional = true
default-features = false
