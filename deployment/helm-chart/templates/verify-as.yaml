{{- if .Values.verifyAs.enabled -}}
{{- $verify := .Values.verifyAs -}}
{{- $name := printf "%s-verify-as" .Release.Name | trunc 63 | trimSuffix "-" -}}
{{- if not .Values.as.image.digest -}}
{{- fail "verifyAs requires a shared as.image.digest" -}}
{{- end -}}
{{- if not (regexMatch "^[a-f0-9]{96}$" $verify.initialRtmr3) -}}
{{- fail "verifyAs.initialRtmr3 must be the approved 48-byte measurement in lowercase hex" -}}
{{- end -}}
{{- if lt (int $verify.replicaCount) 2 -}}
{{- fail "verifyAs.replicaCount must be at least 2" -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "coco-trustee.labels" . | nindent 4 }}
spec:
  replicas: {{ $verify.replicaCount }}
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: verify-as
      {{- include "coco-trustee.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: verify-as
        {{- include "coco-trustee.selectorLabels" . | nindent 8 }}
      {{- with $verify.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      runtimeClassName: {{ required "verifyAs requires a native TDX RuntimeClass" $verify.runtimeClassName | quote }}
      automountServiceAccountToken: false
      {{- with .Values.as.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        {{- range $key := list "kubernetes.io/hostname" "topology.kubernetes.io/zone" }}
        - maxSkew: 1
          topologyKey: {{ $key }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: verify-as
              {{- include "coco-trustee.selectorLabels" $ | nindent 14 }}
        {{- end }}
      containers:
        - name: verify-as
          image: {{ include "coco-trustee.as.image" . | quote }}
          imagePullPolicy: {{ .Values.as.image.pullPolicy }}
          securityContext:
            {{- include "coco-trustee.containerSecurityContext" . | nindent 12 }}
            readOnlyRootFilesystem: true
          command: ["tdx-as-launch"]
          args:
            - --manifest=/etc/verify-as/launch/manifest.json
            - {{ printf "--initial-rtmr3=%s" $verify.initialRtmr3 | quote }}
            - --
            - --inference-only
            - --socket=0.0.0.0:8443
            - --config-file=/etc/verify-as/config.json
            - --https-pubkey-cert=/etc/verify-as/tls/tls.crt
            - --https-prikey=/etc/verify-as/tls/tls.key
            - {{ printf "--inference-concurrency=%v" $verify.concurrency | quote }}
          ports:
            - name: https
              containerPort: 8443
          startupProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
          resources:
            {{- toYaml $verify.resources | nindent 12 }}
          volumeMounts:
            - name: launch
              mountPath: /etc/verify-as/launch
              readOnly: true
            - name: journal
              mountPath: /run/verify-as
            - name: config
              mountPath: /etc/verify-as/config.json
              subPath: config.json
              readOnly: true
            - name: tls
              mountPath: /etc/verify-as/tls
              readOnly: true
      volumes:
        - name: launch
          secret:
            secretName: {{ required "verifyAs.launchManifestSecretName must hold approved manifest.json" $verify.launchManifestSecretName | quote }}
        - name: journal
          emptyDir:
            medium: Memory
        - name: config
          secret:
            secretName: {{ required "verifyAs.configSecretName must hold approved config.json" $verify.configSecretName | quote }}
        - name: tls
          secret:
            secretName: {{ required "verifyAs.tlsSecretName must hold the HTTPS key and certificate" $verify.tlsSecretName | quote }}
      {{- with $verify.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $verify.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: verify-as
    {{- include "coco-trustee.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: verify-as
      {{- include "coco-trustee.selectorLabels" . | nindent 6 }}
{{- end }}
